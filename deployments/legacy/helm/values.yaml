# Default values for TurboCache Helm Chart

# Number of replicas
replicaCount: 3

# Image configuration
image:
  repository: turbocache
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "2112"
  prometheus.io/path: "/metrics"

# Pod security context
podSecurityContext:
  fsGroup: 2000

# Container security context
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Service configuration
service:
  type: ClusterIP
  http:
    port: 8080
    targetPort: 8080
  grpc:
    port: 9090
    targetPort: 9090
  metrics:
    port: 2112
    targetPort: 2112

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: turbocache.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: turbocache-tls
  #    hosts:
  #      - turbocache.example.com

# Resource limits and requests
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - turbocache
          topologyKey: kubernetes.io/hostname

# TurboCache configuration
config:
  server:
    host: "0.0.0.0"
    port: 8080
    read_timeout: "30s"
    write_timeout: "30s"

  cache:
    l1:
      enabled: true
      max_size: 104857600  # 100MB
      max_entries: 100000
      ttl: "10m"
      shard_count: 64

    l2:
      enabled: true
      replication_factor: 2
      consistency_level: "eventual"

    default_ttl: "1h"
    eviction_policy: "lru"
    eviction_interval: "1m"

    protection:
      bloom_filter:
        enabled: true
        expected_items: 1000000
        false_positive_rate: 0.01

      negative_cache:
        enabled: true
        ttl: "5m"
        max_size: 10000

      single_flight:
        enabled: true

      hot_key_detection:
        enabled: true
        threshold: 100
        window: "1m"

      circuit_breaker:
        enabled: true
        threshold: 10
        timeout: "30s"
        failure_ratio: 0.5

  cluster:
    node_id: ""  # Auto-generated if empty
    region: "default"
    zone: "default"
    weight: 100

    discovery:
      type: "etcd"
      endpoints:
        - "etcd:2379"
      register_path: "/turbocache/nodes"
      lease_ttl: "30s"
      heartbeat_interval: "10s"

    hash:
      algorithm: "consistent"
      virtual_nodes: 150
      hash_function: "crc32"

    replication:
      factor: 2
      sync_mode: "async"
      sync_timeout: "5s"

  transport:
    grpc:
      enabled: true
      port: 9090
      max_recv_msg_size: 4194304
      max_send_msg_size: 4194304
      connection_timeout: "5s"

    http:
      enabled: true
      port: 8080

    pool:
      max_size: 100
      min_size: 10
      max_idle_time: "5m"

  metrics:
    enabled: true
    port: 2112
    path: "/metrics"
    interval: "15s"

    prometheus:
      enabled: true
      namespace: "turbocache"

  logger:
    level: "info"
    format: "json"
    output: "stdout"

# etcd dependency (optional, can use external etcd)
etcd:
  enabled: true
  replicaCount: 3
  auth:
    rbac:
      create: false
  persistence:
    enabled: true
    size: 8Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Prometheus ServiceMonitor (if prometheus-operator is installed)
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# ConfigMap for additional configuration files
extraConfigMap: {}

# Additional environment variables
extraEnv: []
  # - name: CUSTOM_VAR
#   value: "custom_value"

# Additional volumes
extraVolumes: []

# Additional volume mounts
extraVolumeMounts: []

# Liveness probe
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
