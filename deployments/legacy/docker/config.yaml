server:
  host: "0.0.0.0"
  port: 8080

cache:
  l1:
    enabled: true
    max_size: 104857600  # 100MB
    max_entries: 100000
    ttl: 3600s
    shard_count: 64
  l2:
    enabled: true
    replication_factor: 2
    consistency_level: "majority"
  eviction_policy: "lru"
  default_ttl: 3600s

cluster:
  discovery:
    type: "etcd"
    endpoints:
      - "etcd1:2379"
      - "etcd2:2379"
      - "etcd3:2379"
    watch_timeout: 5s
  hash:
    virtual_nodes: 150
    hash_function: "xxhash"

transport:
  grpc:
    enabled: true
    port: 9090
  pool:
    max_size: 100
    min_size: 10
    dial_timeout: 5s

metrics:
  enabled: true
  port: 2112
  path: "/metrics"

logger:
  level: "info"
  format: "json"
  output: "stdout"
