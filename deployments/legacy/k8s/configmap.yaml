apiVersion: v1
kind: ConfigMap
metadata:
  name: turbocache-config
  namespace: turbocache
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
      read_timeout: "30s"
      write_timeout: "30s"
      idle_timeout: "120s"
      max_header_bytes: 1048576

    cache:
      l1:
        enabled: true
        max_size: 104857600
        max_entries: 100000
        ttl: "10m"
        shard_count: 64
        stats_window: "1m"

      l2:
        enabled: true
        replication_factor: 2
        consistency_level: "eventual"
        sync_timeout: "5s"
        backup_interval: "1h"

      default_ttl: "1h"
      max_key_size: 1024
      max_value_size: 10485760
      eviction_policy: "lru"
      eviction_interval: "1m"

      protection:
        bloom_filter:
          enabled: true
          expected_items: 1000000
          false_positive_rate: 0.01
          refresh_interval: "1h"

        negative_cache:
          enabled: true
          ttl: "5m"
          max_size: 10000

        single_flight:
          enabled: true

        hot_key_detection:
          enabled: true
          threshold: 100
          window: "1m"
          preload_margin: "10s"

        circuit_breaker:
          enabled: true
          threshold: 10
          timeout: "30s"
          max_requests: 5
          failure_ratio: 0.5

    cluster:
      node_id: ""
      region: "default"
      zone: "default"
      weight: 100
      metadata:
        datacenter: "dc1"

      discovery:
        type: "etcd"
        endpoints:
          - "etcd:2379"
        register_path: "/turbocache/nodes"
        lease_ttl: "30s"
        heartbeat_interval: "10s"
        watch_timeout: "30s"
        retry_interval: "5s"
        max_retries: 3

      hash:
        algorithm: "consistent"
        virtual_nodes: 150
        hash_function: "crc32"
        rebalance_threshold: 0.1

      replication:
        factor: 2
        sync_mode: "async"
        sync_timeout: "5s"
        retry_interval: "1s"
        max_retries: 3

    transport:
      grpc:
        enabled: true
        port: 9090
        max_recv_msg_size: 4194304
        max_send_msg_size: 4194304
        connection_timeout: "5s"
        keepalive_time: "30s"
        keepalive_timeout: "5s"
        max_connection_idle: "5m"
        tls:
          enabled: false

      http:
        enabled: true
        port: 8080

      pool:
        max_size: 100
        min_size: 10
        max_idle_time: "5m"
        dial_timeout: "5s"
        health_check_interval: "30s"

    metrics:
      enabled: true
      port: 2112
      path: "/metrics"
      interval: "15s"
      prometheus:
        enabled: true
        namespace: "turbocache"
        subsystem: ""

    logger:
      level: "info"
      format: "json"
      output: "stdout"
      max_size: 100
      max_age: 30
      max_backups: 10
      compress: true
