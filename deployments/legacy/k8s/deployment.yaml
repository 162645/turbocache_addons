apiVersion: apps/v1
kind: Deployment
metadata:
  name: turbocache
  namespace: turbocache
  labels:
    app: turbocache
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: turbocache
  template:
    metadata:
      labels:
        app: turbocache
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: turbocache
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: turbocache
          image: turbocache:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
            - name: metrics
              containerPort: 2112
              protocol: TCP
          env:
            - name: TURBOCACHE_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TURBOCACHE_CLUSTER_REGION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['topology.kubernetes.io/region']
            - name: TURBOCACHE_CLUSTER_ZONE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['topology.kubernetes.io/zone']
            - name: TURBOCACHE_LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: config
              mountPath: /etc/turbocache
              readOnly: true
            - name: data
              mountPath: /var/lib/turbocache
            - name: logs
              mountPath: /var/log/turbocache
      volumes:
        - name: config
          configMap:
            name: turbocache-config
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - turbocache
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: "turbocache"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

---
apiVersion: v1
kind: Service
metadata:
  name: turbocache
  namespace: turbocache
  labels:
    app: turbocache
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 2112
      targetPort: metrics
      protocol: TCP
  selector:
    app: turbocache

---
apiVersion: v1
kind: Service
metadata:
  name: turbocache-headless
  namespace: turbocache
  labels:
    app: turbocache
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
  selector:
    app: turbocache

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: turbocache-pdb
  namespace: turbocache
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: turbocache

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: turbocache-hpa
  namespace: turbocache
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: turbocache
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: turbocache_hit_rate
        target:
          type: AverageValue
          averageValue: "0.8"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
