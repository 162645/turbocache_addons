global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'turbocache'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Rule files
rule_files:
  - 'rules/*.yml'

# Scrape configurations
scrape_configs:
  # TurboCache metrics
  - job_name: 'turbocache'
    static_configs:
      - targets:
          - 'turbocache1:2112'
          - 'turbocache2:2112'
          - 'turbocache3:2112'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'
        replacement: '${1}'

  # etcd metrics
  - job_name: 'etcd'
    static_configs:
      - targets:
          - 'etcd1:2379'
          - 'etcd2:2379'
          - 'etcd3:2379'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'
