name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
          cache: true

      - name: fmt (check)
        run: make fmt-check

      - name: vet
        run: make vet

      - name: test
        run: make test

      - name: build
        run: make build

      - name: Shell syntax
        run: |
          for script in scripts/*.sh scripts/experiments/*.sh scripts/integration/*.sh scripts/legacy/*.sh; do
            bash -n "$script"
          done

      - name: Compose configuration
        run: docker compose -f deployments/docker-compose.yml config --quiet
